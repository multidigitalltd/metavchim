name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate + generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm --filter @metavchim/api exec prisma validate && pnpm --filter @metavchim/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit dependencies (fail on high)
        run: pnpm audit --audit-level high

  # בניית תמונות הפרודקשן ודחיפה ל-GHCR — רק על מיזוג ל-main.
  # כפתור "עדכן גרסה" במסך ההגדרות מושך את :latest מכאן (docs/10).
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web, workers, updater]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.target }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.target }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            NEXT_PUBLIC_API_URL=
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
