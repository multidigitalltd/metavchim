name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# ‎**על main כל SHA מקבל קבוצה משלו — ולכן שום ריצה אינה מבוטלת.**
#
# על ענף עבודה ביטול הוא חיסכון נכון: הקומיט החדש מחליף את הישן,
# וממילא רק הוא מעניין. על main המשמעות הפוכה — כל ריצה שם בונה
# ודוחפת תמונות Docker המתויגות ב-SHA שלה, והיא **הדבר היחיד**
# שמייצר גרסה שאפשר לפרוס. ריצה שבוטלה = קומיט בלי תמונה.
#
# שלושה מיזוגים נחתו בתוך שמונה דקות וכל אחד ביטל את קודמו:
# שלושה מיזוגים ירוקים ואף תמונה חדשה. „משוך ועדכן” המשיך להציג
# את הגרסה שלפניהם, ומכיוון שביטול אינו כישלון — לא היה אדום בשום
# מקום שהיה מסגיר את זה.
#
# ‎**`cancel-in-progress: false` לבדו אינו מספיק**, וזו הטעות
# בגרסה הראשונה של התיקון הזה (ביקורת Codex): ריצה שממתינה בתור
# מבוטלת כשמגיעה שלישית לאותה קבוצה, גם כשהדגל כבוי. שלוש דחיפות
# רצופות היו עדיין מאבדות את האמצעית — כלומר בדיוק התרחיש שקרה.
#
# הפרדה לפי SHA פותרת את זה בשורש: אין קבוצה משותפת, אין תור, אין
# מה לבטל. ריצות main רצות במקביל וכל מיזוג מקבל את התמונות שלו.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'ref' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate + generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm --filter @metavchim/api exec prisma validate && pnpm --filter @metavchim/api exec prisma generate

      - name: Lint
        run: pnpm lint

      # ‏**השער של השער.** `israel-time/device-clock` הוא הכלל שמחליף
      # את סריקת הטקסט, וכלל שנשבר בשקט גרוע משער שאינו קיים: הוא
      # מדווח „נקי” על עץ שאיש לא בדק. המקרים כוללים את ארבעת
      # האיותים שחמקו מהשער הקודם, ואת הקוד התקין שאסור שיסומן.
      - name: ESLint rules
        run: pnpm test:eslint-rules

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # קבצים סטטיים שהקוד מפנה אליהם. תמונה חסרה אינה מפילה בנייה
      # ואינה מפילה טיפוסים — היא מגיעה למשתמש כתמונה שבורה. מסך
      # ההדרכות הפנה לקובץ שלא היה קיים, וזה עבר את כל השערים שמעל.
      - name: Static assets exist
        run: pnpm --filter @metavchim/web verify:assets

      # שפת ההפניות. משרד תיווך שמוכר לקוחות ומשרד שמפנה לקוח לעמית
      # הם שני דברים שונים — מקצועית ורגולטורית — והתמורה כאן משולמת
      # על ההפניה ולא על התוצאה. הכלל היה כתוב בתיעוד מהיום הראשון
      # ולא היה לו מקום להיאכף בו, ולכן השפה נסחפה חזרה למסחר.
      - name: Referral language
        run: pnpm --filter @metavchim/web verify:language

      # שעון ישראל אינו צעד נפרד עוד — הוא כלל ESLint
      # (`israel-time/device-clock`) ורץ בתוך `lint`. השער הקודם סרק
      # טקסט, וארבעה סבבי ביקורת רצופים היו אותו דבר בדיוק: איות חוקי
      # של אותו API שהתבניות לא מנו. ביטוי רגולרי אינו יכול למנות שפה.
      #
      # המחלקה עצמה נשארת בלתי נראית כאן: CI רץ ב-UTC, שם קריאה בשעון
      # המכשיר מחזירה במקרה את התשובה הנכונה. זו הסיבה שהיא זקוקה לשער.

      # רצפת הטיפוגרפיה: 14px, ובלי משקל דק. גודל טקסט אינו החלטה
      # שנשמרת בזיכרון — הוא נכתב מחדש בכל רכיב, ותמיד לכיוון הקטן.
      # המערכת עברה כבר סבב הגדלה שלם; בלי שער הוא נשחק תוך כמה
      # מסכים, כי אף אחד לא רואה את המצטבר — רק את המסך שלפניו.
      - name: Typography floor
        run: pnpm --filter @metavchim/web verify:typography

      # ניגודיות הטוקנים. זו הפעם השלישית שהמערכת מתקנת ניגודיות
      # אחרי דיווח משתמשים, ובפעם הזו התברר שהתלונה על „טקסטים
      # בהירים” הצביעה על המסגרות: הטקסט עמד ב-18.8:1 בזמן שגבול
      # שדה הקלט עמד על 1.29:1 מול סף של 3:1. גבול חיוור נראה
      # „עדין” ולא „שבור” — ולכן העין אינה תופסת אותו, ומספר כן.
      - name: Colour contrast floor
        run: pnpm --filter @metavchim/web verify:contrast

      # רמז הגלילה בסרגל הלשוניות. הסרגל נגלל לרוחב ופס הגלילה מוסתר
      # בכוונה, והצירוף הזה הפך לשונית שנקטעת על קצה המסך לתוכן
      # שנראה חתוך — בלי שום סימן שאפשר להגיע אליו. שלושת חלקי
      # התיקון (מסכה, מדידה בזמן ריצה, וגלילת הפעילה מעבר למסכה)
      # חסרי תועלת כל אחד לחוד, ולכן הם נאכפים יחד.
      - name: Tab strip scroll affordance
        run: pnpm --filter @metavchim/web verify:scroll

      # שם מחלקה שכבר תפוס. כרטיס הפתיח של המנטור נקרא `.mv-greet`,
      # שם שנראה פנוי — וכבר שייך לברכת הבוקר בדשבורד; ובאותה מכה
      # `.mv-privacy` של באנר השת״פים. שתי ההגדרות חיות באותו קובץ
      # והמאוחרת גוברת, כלומר עמוד אחד עוצב ושניים אחרים נשברו
      # בשקט — בלי שגיאה, בלי אזהרה, ובלי סימן בעמוד שנגעו בו.
      - name: One owner per class name
        run: pnpm --filter @metavchim/web verify:namespace

      # רשימה שחזרה חסרה מהשרת היא **כשל טעינה, לא רשימה ריקה.**
      # ‎`apiGet<{ coupons: Coupon[] }>` הוא הצהרת טיפוס בלבד, ותשובה
      # פגומה שנורמלה ל-`[]` הציגה „עדיין אין קופונים” — מנהל
      # פלטפורמה קורא את זה ויוצר מחדש קוד שכבר קיים. באותו דפוס:
      # „אין מסלולים” במסך ההרשמה, ו„אין חיבורים נוספים” בשומר
      # החיבור היחיד — שם השקר מבטל אכיפה בשקט.
      - name: Server lists fail loudly
        run: pnpm --filter @metavchim/web verify:lists

      # מה שהמסך מצהיר עליו מול מה שהבקר מחזיר. `apiGet<T>` הוא
      # הצהרה ולא ולידציה: הדשבורד ביקש `{ items }` מ-`GET /offers`
      # שמחזיר מערך, ולכן המונה „הצעות ממתינות” הראה אפס מאז ומתמיד
      # בלי להיראות שבור.
      - name: Response shapes match the controller
        run: pnpm --filter @metavchim/web verify:shapes

      # ‏`mv-card` נותן משטח ולא ריפוד, וכל קורא חייב להוסיף אותו
      # בעצמו. ששת הכרטיסים שבעמוד הנכס לא הוסיפו, והתוכן — טקסט,
      # מפה, שדה קלט ומשבצות תמונה — נגע במסגרת. אף שער אחר לא רואה
      # את זה: הטיפוגרפיה חוקית, הניגודיות חוקית, וה-TypeScript מרוצה.
      - name: Cards are padded
        run: pnpm --filter @metavchim/web verify:cards

      # פעולה הרסנית נשאלת, ולא נגללים אליה. אייקון הפח בכרטיס הנכס
      # גלל אל כרטיס בתחתית העמוד במקום למחוק — ומי שלוחץ על פח
      # אשפה ומקבל תזוזה אינו יודע אם משהו קרה, ולוחץ שוב. השער
      # שומר בעיקר על מה שקל לאבד בהעברה: הגילוי שסופר כמה כרטיסי
      # אדם יירדו עם הנכס, והאישור שחסום עד שהוא מגיע.
      - name: Destructive actions ask before they act
        run: pnpm --filter @metavchim/web verify:destructive

      # הכרעות פריסה של בעל המוצר, מסך אחר מסך: המונים והסוכן בתחתית
      # הדשבורד (§24 של חבילת העיצוב מתארת את ההפך, וההערה שישבה על
      # הפאנל נימקה את המיקום הישן — כלומר מי שיקרא אותם יחזיר את
      # הסדר בתום לב), הפעולות מעל טבלת הנכסים, ו„הבנתי” שמסתיר שורה
      # עד מחר ולא לתמיד. אף שער אחר אינו רואה סדר: הוא נראה, וזהו.
      - name: Layout decisions hold
        run: pnpm --filter @metavchim/web verify:layout

      # ‏עמדת „טאבו משותף” של קונה נגזרת ולא נקראת מהשדה: קונה מדור
      # ‏קודם מבטא אותה דרך `propertyTypes`. הסינון, ההתאמות והשידוך
      # ‏עברו לגזירה וטופס העריכה נשאר מאחור — כלומר על אותו קונה
      # ‏המערכת פעלה כ„מוכן” והמסך אמר „טרם נשאל”. אין ב-web בדיקות
      # ‏יחידה, והחתימה זהה בשני המקרים, ולכן זה נראה רק כאן.
      - name: Buyer stance is derived, not read raw
        run: pnpm --filter @metavchim/web verify:stance

      # מסך שמבקש יותר מ-PAGE_LIMIT_MAX נדחה ב-400 ומציג „לא נמצאו”
      # על מאגר מלא. זה קרה פעמיים בשני בוררים שונים.
      - name: Screens never ask for more than the gate accepts
        run: pnpm --filter @metavchim/web verify:limits

      # ההדרכות והתיעוד הם בית אחד, והבית הוא הציבורי. השער מוודא
      # ש-`/guides` נשאר הפניה ולא חוזר להיות מסך שני שמצייר את אותו
      # תוכן — הפיצול הזה כבר ייצר כאן שתי גרסאות שנפרדו זו מזו.
      - name: Docs are the single home
        run: pnpm --filter @metavchim/web verify:docs

      # עליית ה-API על הפלט המהודר. חייב לרוץ אחרי הבנייה ולא כבדיקת
      # יחידה: רק `tsc` פולט את מטא-דאטת הבנאי ש-Nest צריך כדי לפתור
      # תלויות, ולכן חיווט שבור נראה רק כאן. תקלת ייצור אחת עברה את
      # כל השערים שמעל ובכל זאת הפילה את המערכת כולה.
      - name: API boots (dependency graph)
        # ערכים מזויפים ובכוונה: הבדיקה מוודאת חיווט, לא תצורה. היא
        # אינה מתחברת לשום דבר — `compile()` אינו מריץ `onModuleInit`,
        # ושם יושבים החיבורים בפועל.
        env:
          WEB_ORIGIN: https://ci.invalid
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PHONE_HASH_KEY: ci-phone-hash-key-not-a-real-secret-000000
        run: pnpm --filter @metavchim/api verify:boot

      # תבנית הסביבה של Ansible מול .env.production.example. מפתח
      # שנשכח בתבנית אינו מפיל בנייה ואינו מפיל טיפוסים — הוא מגיע
      # לשרת כשירות שעולה בלי המשתנה, ונכשל בשקט.
      - name: IaC template matches env example
        run: pnpm verify:iac

      - name: Every service ships the same commit
        run: pnpm verify:release

      # ‏פעולה ארוכה שהכישלון שלה נשאר ב-`console.error` נראית מהמסך
      # ‏בדיוק כמו הצלחה. `runUpdate` הייתה כזו, והלקוח לחץ „עדכן”
      # ‏שוב ושוב מול הודעה שאמרה „הופעל” בכל פעם.
      - name: Every updater operation reports its outcome
        run: pnpm verify:updater

      # ארכיון מדיה משלים מחזיק רק את מה שהשתנה. run.sh, restore.sh
      # ו-backup-file.ts חייבים להסכים על כך; אם לא — השחזור פורס
      # ארכיון חלקי לתוך אחסון שנמחק זה עתה, בלי שגיאה אחת בדרך.
      - name: Media backup chain is consistent
        run: pnpm verify:backup

      # לאן נוחתת לחיצה על התראה. הטבלה היא מחרוזות, ולכן נתיב
      # שאינו קיים עובר טיפוסים ובדיקות: שלוש ישויות קישרו ל-404,
      # ו-`coop_deal` לא הייתה בה כלל — כלומר ההודעה בוואטסאפ
      # בישרה שנפתח חדר עסקה בלי לומר איפה הוא.
      - name: Notifications land on screens that exist
        run: pnpm verify:notify

      # רמז אוצר המילים הוא הדבר היחיד שמטה את מודל התמלול לטובת
      # „ממ״ד” על פני „ממד”. ההכתבה שלחה אותו, תמלול השיחות לא —
      # כלומר האודיו הגרוע ביותר היה היחיד בלי הקשר, בשקט מוחלט.
      - name: Every /transcribe caller sends the vocabulary hint
        run: pnpm verify:stt

      # ‏תפקיד הוא נקודת פתיחה, לא הרשאה: מעליו יושבים חריגים
      # פר-משתמש וחסימת מודולים. גזירה מהתפקיד בלבד מציעה פעולה
      # שהשרת ידחה — או מסתירה יכולת שניתנה במפורש — בשקט מוחלט.
      - name: Action permissions come from effective capabilities
        run: pnpm verify:caps

      # ‏השער של השער: סיווג תוצאת הסריקה נבדק בלי רשת, כי טעות בו
      # שקטה בשני הכיוונים — ממצא שנקרא ככשל רשת עובר בשקט, וכשל
      # לא-מוכר שנקרא ככשל רשת פותח את השער לכל דבר.
      - name: Audit gate self-test
        run: pnpm test:audit-gate

      # ‏נכשל על **ממצא**, לא על הרשת.
      #
      # ‏התקרה הארוכה למטה נוספה אחרי ש-ERR_SOCKET_TIMEOUT הפיל ריצה
      # ירוקה, והיא עדיין נכונה — אבל היא מטפלת באיטיות ולא בהשבתה.
      # ב-3 בספטמבר נקודת הקצה `audits/quick` לא הגיבה שעתיים וחצי
      # וחזרה ליפול למחרת בבוקר: שבע ריצות אדומות על PR-ים שלא נגעו
      # ב-`package.json` ולא ב-`pnpm-lock.yaml`. אדום שחוזר בלי קשר
      # לשינוי מלמד להתעלם ממנו, ושער שמתעלמים ממנו אינו שער.
      #
      # ‏הסף לא זז — high/critical עדיין מפילים. מה שהשתנה הוא שכשל
      # רשת מזוהה ככזה ויוצא באזהרה, ו-`audit.yml` סורק כל בוקר במצב
      # חמור כדי שחלון כזה לא יבלע פגיעות בשקט.
      - name: Audit dependencies (fail on high)
        env:
          npm_config_fetch_timeout: "300000"
          npm_config_fetch_retries: "4"
        run: pnpm audit:deps

  # ה-Playbook שמקים את השרת — נטען ומתפרש.
  #
  # משימה נפרדת כי היא היחידה שצריכה Python. היא אינה מריצה דבר מול
  # שרת: אין לנו מכונה חד-פעמית ב-CI, ולכן מה שנבדק כאן הוא שהקובץ
  # תקין ולא שההרצה מצליחה. את ההרצה בודקים ב-`--check` מול הייצור
  # לפני מיזוג, וזה כתוב ב-README שליד.
  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ansible-core
      - name: Playbook syntax
        working-directory: infra/ansible
        run: ansible-playbook -i inventory.example.ini --syntax-check site.yml

  # בידוד הדיירים מול Postgres אמיתי.
  #
  # משימה נפרדת ולא צעד ב-verify: היא דורשת מסד, ותקלת תשתית בה
  # אינה סיבה להסתיר אם ה-lint או הטיפוסים נשברו. היא כן חוסמת
  # מיזוג — זו ההוכחה שמדיניות ה-RLS באמת חוסמת, ולא רק שהקוד
  # כתוב נכון.
  cross-tenant:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metavchim
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: metavchim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metavchim"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DIRECT_DATABASE_URL: postgresql://metavchim:ci@localhost:5432/metavchim?schema=public
      DATABASE_URL: postgresql://metavchim:ci@localhost:5432/metavchim?schema=public
      APP_DATABASE_URL: postgresql://metavchim_app:ci_app_password_16ch@localhost:5432/metavchim?schema=public
      # `?schema=public` הוא פרמטר של Prisma ולא של libpq, ו-psql
      # דוחה אותו ב-"invalid URI query parameter". שתי כתובות ולא
      # אחת — לכל כלי הצורה שהוא מבין.
      PSQL_URL: postgresql://metavchim:ci@localhost:5432/metavchim
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # יצירת התפקיד **לפני** המיגרציות: חלקן מפנות אליו
      # ב-GRANT/REVOKE ונופלות אם אינו קיים. זהו בדיוק מה שעושה
      # `infra/postgres/init-app-role.sh` בעליית המסד בייצור —
      # יצירה בלבד, בלי הרשאות פר-טבלה, כי אין עדיין טבלאות.
      - name: App role
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE metavchim_app LOGIN PASSWORD 'ci_app_password_16ch'" \
            -c "GRANT USAGE ON SCHEMA public TO metavchim_app"

      - name: Migrate
        run: pnpm --filter @metavchim/api exec prisma migrate deploy

      # לקוח Prisma אינו בגיט — הוא נוצר מהסכמה. משימת `verify`
      # מייצרת אותו לעצמה, והמשימה הזו רצה במקביל ובמכונה אחרת.
      - name: Prisma client
        run: pnpm --filter @metavchim/api exec prisma generate

      # אותו נימוק בדיוק, לחבילה המשותפת: `dist/` אינו בגיט, ובלעדיו
      # כל `import` מ-`@metavchim/shared` נופל כאן ב-resolve. בדיקת
      # אינטגרציה שמשווה את ההיגיון שבקוד להתנהגות המסד — למשל שהסדר
      # ש-`canonicalTwinPair` מחשבת הוא הסדר שהאילוץ מקבל — חייבת
      # לייבא ממנה, וזו בדיוק הבדיקה ששווה להריץ מול מסד אמיתי.
      - name: Shared build
        run: pnpm --filter @metavchim/shared build

      # וההרשאות **אחרי**. `create_app_role.sql` מסתיים ב-
      # `REVOKE ... ON audit_log`, וטבלה שאינה קיימת מפילה את
      # הסקריפט תחת ON_ERROR_STOP (ביקורת Codex). בייצור זה נפתר
      # מעצמו: ההרשאות לטבלאות חדשות מגיעות מ-ALTER DEFAULT
      # PRIVILEGES, וכאן ההרצה המפורשת זולה וברורה יותר.
      - name: Grants
        run: psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/sql/create_app_role.sql

      - name: Cross-tenant isolation
        run: pnpm --filter @metavchim/api test:rls

  # בניית תמונות הפרודקשן ודחיפה ל-GHCR — רק על מיזוג ל-main.
  #
  # ‎**התג הזז כאן הוא הקומיט בלבד, ולא `:latest`.** כל יעד נבנה
  # בג'וב נפרד ומסיים בזמן אחר — ב-2c2fd8e היה הפרש של 4.5 דקות בין
  # web לבין api — ולכן הזזת `:latest` כאן פירושה שבחלון הזה
  # ‎`:latest` של השירותים מצביע על שני קומיטים שונים. „עדכן גרסה”
  # שנלחץ בתוכו מושך חצי גרסה, והמערכת רצה בשתי גרסאות במקביל.
  # ההזזה עברה ל-`publish` שלמטה, אחרי שכולם נבנו.
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, cross-tenant, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web, workers, updater]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.target }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            NEXT_PUBLIC_API_URL=
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  # ‎**`:latest` זז לכל השירותים יחד, ורק אחרי שכולם נבנו.**
  #
  # ‎`needs: docker` הוא כל העניין: כישלון בבנייה של יעד אחד מונע את
  # ההזזה **מכולם**, במקום להשאיר שלושה מעודכנים ואחד מאחור לצמיתות
  # — כי `:latest` של מי שנכשל היה נשאר על הקומיט הקודם, ומשיכה
  # חוזרת הייתה מביאה אותו שוב ושוב.
  #
  # ‎`imagetools create` מזיז תג על המניפסט בצד ה-Registry: אין כאן
  # משיכה, בנייה או בחירת ארכיטקטורה, ולכן ארבע ההזזות לוקחות שניות
  # ולא דקות. חלון אי-ההסכמה מצטמצם לזה, במקום לאורך הבנייה.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # ‎**שחרור אחד בכל רגע** (ביקורת Codex, P1).
    #
    # ‏ה-`concurrency` של ה-workflow כולל את ה-SHA — בכוונה, כדי
    # ‏ששני מיזוגים סמוכים לא יבטלו זה את הבנייה של זה — ולכן שני
    # ‎`publish` של שני קומיטים היו רצים **במקביל** וכותבים לאותם
    # ‏ארבעה תגים. שתי לולאות שמשתלבות זו בזו משאירות בדיוק את המצב
    # ‏שה-PR הזה בא למנוע, ולצמיתות.
    #
    # ‏קבוצה בלי ה-SHA מסדרת אותם בתור. `cancel-in-progress: false`
    # ‏כי שחרור באמצע אינו דבר שמבטלים — ביטול בין הזזה שנייה
    # ‏לשלישית הוא בדיוק הפיצול.
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      # ‏התור מסדר, אבל אינו קובע מי אחרון: ריצה ישנה שממתינה מאחורי
      # ‏חדשה הייתה מחזירה את `:latest` אחורה כשתגיע תורה. מי שאינו
      # ‏ראש `main` אינו משחרר — הריצה של הקומיט החדש כבר עשתה זאת.
      - name: Publish only if this commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "$tip" != "${{ github.sha }}" ]; then
            echo "מדלג: ראש main הוא $tip, וזו הריצה של ${{ github.sha }}"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        if: steps.tip.outputs.stale != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # הרשימה זהה למטריצה שמעל — `verify:release` אוכף את זה, כי
      # יעד שנוסף שם ולא כאן היה נשאר עם `:latest` קפוא לנצח.
      #
      # ‏ניסיון חוזר ולא הזזה אחת: ארבע כתיבות ל-Registry אינן
      # ‏אטומיות, וכשל ברביעית אחרי ששלוש עברו הוא פיצול (ביקורת
      # ‏Codex, P1). גלגול אחורה אינו פתרון — הוא עוד ארבע כתיבות עם
      # ‏אותה בעיה בדיוק. לכן: ניסיון חוזר, ואז אימות שאומר את האמת.
      - name: Move :latest to this commit — every service at once
        if: steps.tip.outputs.stale != 'true'
        run: |
          for target in api web workers updater; do
            image="ghcr.io/${{ github.repository }}-${target}"
            for attempt in 1 2 3; do
              if docker buildx imagetools create -t "${image}:latest" "${image}:${{ github.sha }}"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::הזזת ${target}:latest נכשלה שלוש פעמים"
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
          done

      # ‏הצהרה על מה שבאמת יש ב-Registry, ולא על מה שהפקודות החזירו.
      # ‏פיצול שנשאר אחרי הניסיונות החוזרים חייב להיות בנייה אדומה
      # ‏ולא הודעה בלוג: זה המצב שמפיל את המערכת לשתי גרסאות, והוא
      # ‏אינו מתקן את עצמו.
      - name: Every :latest points at this commit
        if: steps.tip.outputs.stale != 'true'
        run: |
          split=""
          for target in api web workers updater; do
            image="ghcr.io/${{ github.repository }}-${target}"
            want="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${image}:${{ github.sha }}")"
            got="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${image}:latest")"
            if [ "$want" != "$got" ]; then
              echo "::error::${target}:latest הוא ${got}, ואמור להיות ${want}"
              split="yes"
            fi
          done
          if [ -n "$split" ]; then
            echo "::error::‏`:latest` מפוצל בין שירותים — אין לעדכן עד שיתוקן"
            exit 1
          fi
