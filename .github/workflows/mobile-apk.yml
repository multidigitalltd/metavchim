# ‏APK לבדיקות ידניות — בלחיצה, בלי חשבון Expo.
#
# ‏`expo prebuild` מייצר את פרויקט האנדרואיד מ-app.json, ו-Gradle בונה
# ‏APK חתום במפתח הדיבאג של התבנית — מתקין על כל מכשיר עם „מקורות לא
# ‏ידועים”, ואינו מתאים לחנות (שם החתימה מגיעה מ-EAS). כתובת השרת
# ‏נצרבת מהקלט, ואפשר לשנות אותה גם באפליקציה („הגדרות מתקדמות”
# ‏במסך ההתחברות).
#
# ‏פוש נייטיב דורש מזהה פרויקט EAS ב-app.json; בלעדיו האפליקציה
# ‏מדווחת „לא זמין בסביבה הזו” וכל השאר עובד.
#
# ‏**רץ גם על כל מיזוג ל-main שנוגע באפליקציה או בחבילה המשותפת**,
# ‏ומעלה את הקובץ ל-Release מתגלגל בשם `mobile-latest` — כך שהקובץ
# ‏העדכני תמיד באותה כתובת, בלי לחפש ריצה בלשונית Actions. השרת
# ‏מתעדכן בנפרד (כפתור „עדכן גרסה” ב-/platform), והנתונים אינם
# ‏תלויים בזה בכלל: האפליקציה קוראת את אותו מסד דרך אותו API.
name: Mobile APK

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/mobile-apk.yml
  workflow_dispatch:
    inputs:
      api_url:
        description: "כתובת ה-API שתיצרב (למשל https://app.metavchim.co.il)"
        required: true
        default: "https://app.metavchim.co.il"

# ‏Release אחד מתגלגל — שתי ריצות במקביל היו דורסות זו את זו
concurrency:
  group: mobile-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ‏Metro טוען את dist/ של החבילה המשותפת — כמו ב-web
      - name: Build shared package
        run: pnpm --filter @metavchim/shared build

      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # ‏שתי ארכיטקטורות הטלפונים בלבד — בלי x86 של אמולטורים, שמכפיל
      # ‏את גודל הקובץ. APK אוניברסלי לבדיקות היה 110MB; כך כ-60MB.
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          # ‏בריצה אוטומטית (push) אין קלט — הייצור
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://app.metavchim.co.il' }}
          # ‏מוצג במסך „עוד” — כדי לדעת איזה קומיט מותקן על המכשיר
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
        # ‏R8, כיווץ משאבים ואריזת ספריות נייטיב דחוסה — 22MB במקום 110MB.
        run: >-
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          -Pexpo.useLegacyPackaging=true

      - name: Name the file by commit
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "metavchim-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: metavchim-${{ github.sha }}
          path: metavchim-*.apk
          if-no-files-found: error
          retention-days: 14

      # ‏הקובץ העדכני תמיד כאן: Releases ⟵ mobile-latest. התג זז לקומיט
      # ‏הזה, והקובץ הקודם מוחלף — לא נערמים.
      - name: Publish as the rolling mobile-latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete mobile-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create mobile-latest metavchim-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "אפליקציה לנייד — APK עדכני (${GITHUB_SHA::7})" \
            --notes "נבנה אוטומטית מ-main בקומיט ${GITHUB_SHA}. מתקינים ישירות על אנדרואיד (חתום במפתח דיבאג; לא לחנות). כתובת השרת הצרובה: https://app.metavchim.co.il — ניתנת לשינוי ב„הגדרות מתקדמות” במסך ההתחברות."
