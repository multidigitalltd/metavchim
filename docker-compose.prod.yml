# ============================================================
# פרודקשן על שרת יחיד (VPS) — ראו docs/10-deployment.md להוראות מלאות.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# התמונות נבנות ב-CI על כל מיזוג ל-main ונדחפות ל-GHCR; כפתור העדכון
# במסך ההגדרות מפעיל את שירות ה-updater שמושך ומרים אותן מחדש.
# ============================================================
name: metavchim

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metavchim
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?חסר DB_OWNER_PASSWORD ב-.env.production}
      POSTGRES_DB: metavchim
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?חסר APP_DB_PASSWORD ב-.env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # תפקיד האפליקציה (RLS) נוצר אוטומטית בעליית ה-DB הראשונה —
      # לפני מיגרציות ה-API, שמפנות אליו
      - ./infra/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metavchim"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF — משימות BullMQ שורדות ריסטרט
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - miniodata:/data

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/multidigitalltd/metavchim}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    # loopback בלבד — לדיבוג מהשרת עצמו, לא לאינטרנט. התנועה
    # האמיתית נכנסת דרך Caddy.
    ports:
      - "127.0.0.1:${API_LOCAL_PORT:-8091}:3001"
    environment:
      UPDATER_URL: http://updater:9944
    volumes:
      # רשימת הגיבויים ומחיקה מהמסך /platform. הרשאת כתיבה מכוונת:
      # השחזור עצמו עובר דרך סוכן העדכון, אבל מחיקה נעשית כאן.
      - ${BACKUP_DIR:-./backups}:/backups
      # מצב הסנכרון החיצוני — לקריאה בלבד. אישורי ה-R2 נשארים
      # בקונטיינר offsite ולא נחשפים לאפליקציה.
      - offsitestate:/state:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  workers:
    image: ${IMAGE_PREFIX:-ghcr.io/multidigitalltd/metavchim}-workers:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      # ה-API מריץ מיגרציות בעלייה — ה-Workers מחכה שיהיה בריא
      api:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/multidigitalltd/metavchim}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # קריאות מהשרת (רכיבי שרת) חייבות כתובת מוחלטת. כתובת הדפדפן
      # נבנית ריקה בכוונה — same-origin דרך ה-Proxy — ולכן היא אינה
      # שמישה כאן, ובלי המשתנה הזה עמודי התקנון היו מציגים תמיד את
      # נוסח ברירת המחדל במקום את מה שנערך ב-/platform.
      INTERNAL_API_URL: http://api:3001
    ports:
      - "127.0.0.1:${WEB_LOCAL_PORT:-8090}:3000"

  # שער ה-HTTPS — תמיד פעיל, ותמיד היחיד.
  #
  # המערכת היא ענן בהתקנה אחת (app.metavchim.co.il); אין התקנות
  # בשרת של לקוח, ולכן אין תרחיש שבו שרת Web אחר כבר תופס 80/443.
  # הפרופיל שאיפשר לכבות את Caddy הוסר יחד עם התרחיש הזה.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # `:?` — Caddy רץ תמיד, ולכן דומיין חסר הוא שגיאת הגדרה ולא
      # מצב אפשרי. עדיף שכל פקודת compose תיפול מיד ובבירור מאשר
      # ש-Caddy יעלה בלי דומיין וייכשל בהנפקת התעודה.
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

  # תמלול מקומי (faster-whisper על CPU) — ההקלטות לא יוצאות מהשרת.
  # פעיל רק בפרופיל stt: מוסיפים stt ל-COMPOSE_PROFILES.
  # דורש ~2GB RAM פנויים; ראו docs/10-deployment.md §תמלול מקומי.
  stt:
    profiles: ["stt"]
    build:
      context: ./infra/stt
    restart: unless-stopped
    environment:
      STT_MODEL: ${STT_MODEL:-ivrit-ai/whisper-large-v3-turbo-ct2}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_LANGUAGE: ${STT_LANGUAGE:-he}
      # לא :? — compose מפרש את הקובץ *לפני* סינון הפרופילים, וסוד
      # חסר היה שובר כל פקודה גם כשהתמלול כבוי. השירות עצמו נכשל
      # בבירור בעלייה אם הסוד ריק (ראו server.py).
      STT_SECRET: ${STT_SECRET:-}
      STT_CONCURRENCY: ${STT_CONCURRENCY:-1}
      OMP_NUM_THREADS: ${STT_THREADS:-2}
    volumes:
      # מטמון המודל — נמשך פעם אחת ונשאר בין הפעלות
      - sttmodels:/models
    # תקרת משאבים: התמלול לא יחנוק את שאר המערכת
    deploy:
      resources:
        limits:
          memory: ${STT_MEMORY_LIMIT:-3g}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # זיהוי דוברים בשיחות טלפון (pyannote על CPU) — "מי אמר מה" בתמלול.
  # פעיל רק בפרופיל diarize, *בנוסף* ל-stt: התמלול עצמו נשאר בשירות stt
  # והשירות הזה מוסיף לו רק את תורי הדיבור.
  # דורש HF_TOKEN ואישור תנאי המודל; ראו docs/10-deployment.md §זיהוי דוברים.
  diarize:
    profiles: ["diarize"]
    build:
      context: ./infra/diarize
    restart: unless-stopped
    environment:
      DIARIZE_MODEL: ${DIARIZE_MODEL:-pyannote/speaker-diarization-3.1}
      # אותו סוד משותף של שירות התמלול — שני השירותים באותה רשת פנימית
      STT_SECRET: ${STT_SECRET:-}
      HF_TOKEN: ${HF_TOKEN:-}
      DIARIZE_MAX_SPEAKERS: ${DIARIZE_MAX_SPEAKERS:-4}
      DIARIZE_CONCURRENCY: ${DIARIZE_CONCURRENCY:-1}
      OMP_NUM_THREADS: ${DIARIZE_THREADS:-2}
    volumes:
      - diarizemodels:/models
    deploy:
      resources:
        limits:
          memory: ${DIARIZE_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9001/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # גיבוי אוטומטי — pg_dump יומי + ארכיון מדיה יומי אל ${BACKUP_DIR}
  # במארח. המדיה מארכבת במלואה אחת ל-BACKUP_MEDIA_FULL_DAYS ובין לבין
  # רק מה שהשתנה. שחזור: ראו docs/10-deployment.md §גיבוי ושחזור.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup/run.sh"]
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD:?חסר DB_OWNER_PASSWORD ב-.env.production}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_MEDIA_KEEP_DAYS: ${BACKUP_MEDIA_KEEP_DAYS:-30}
      BACKUP_MEDIA_FULL_DAYS: ${BACKUP_MEDIA_FULL_DAYS:-7}
      BACKUP_MIN_FREE_MB: ${BACKUP_MIN_FREE_MB:-2048}
    volumes:
      - ./infra/backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - miniodata:/minio-data:ro
    depends_on:
      postgres:
        condition: service_healthy

  # עותק גיבוי מחוץ לשרת — סנכרון תיקיית הגיבויים לאחסון ענן תואם-S3
  # (Backblaze B2 / Cloudflare R2 / AWS S3…). פעיל רק בפרופיל offsite:
  # מוסיפים offsite ל-COMPOSE_PROFILES וממלאים את משתני OFFSITE_S3_*.
  offsite:
    profiles: ["offsite"]
    image: rclone/rclone:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup/offsite.sh"]
    environment:
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      # R2 דורש region=auto; לספקים אחרים אפשר לדרוס במשתנה
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_S3_REGION:-auto}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_KEY:-}
      # טוקן R2 מוגבל לדלי אחד אינו רשאי ליצור דליים; בלי זה rclone
      # מנסה לוודא קיום דלי ונכשל בהרשאה
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: ${OFFSITE_S3_NO_CHECK_BUCKET:-true}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
    volumes:
      - ./infra/backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups:ro
      # קובץ מצב הסנכרון שה-API קורא (/platform ⟵ גיבויים)
      - offsitestate:/state
    depends_on:
      - backup

  # שחזור מגיבוי — אף פעם לא עולה מעצמו (פרופיל ייעודי). סוכן העדכון
  # מריץ אותו כפעולה חד-פעמית אחרי שעצר את שירותי האפליקציה.
  restore:
    profiles: ["restore"]
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/backup/restore.sh"]
    environment:
      # לא :? מאותה סיבה כמו ב-caddy — שירות מאחורי פרופיל שדורש
      # משתנה מפיל כל פקודת compose. אין כאן ויתור על הבדיקה:
      # postgres ו-backup, שרצים תמיד, כבר דורשים את המשתנה הזה.
      PGPASSWORD: ${DB_OWNER_PASSWORD:-}
    volumes:
      - ./infra/backup:/backup:ro
      # כתיבה — גם דאמפ הבטיחות לפני השחזור נשמר כאן
      - ${BACKUP_DIR:-./backups}:/backups
      # שחזור התמונות דורס את תוכן ה-volume, ולכן אינו read-only
      - miniodata:/minio-data
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------
  # סוכן העדכון. הוא מריץ docker compose מול ה-Docker של המארח, ולכן
  # כל נתיב יחסי בקובץ הזה נפתר פעמיים: פעם על ידי ה-CLI *בתוך*
  # הקונטיינר, ופעם על ידי ה-daemon *על המארח*.
  #
  # לכן הריפו מחובר בדיוק לאותו נתיב מוחלט שבו הוא יושב על המארח.
  # קודם הוא חובר ל-/srv/repo, ואז `./backups` נפתר ל-/srv/repo/backups
  # על המארח — תיקייה שלא קיימת שם. Docker יצר אותה ריקה וחיבר אותה,
  # וכך אחרי "עדכן גרסה" מתוך המערכת ה-API ראה תיקיית גיבויים ריקה
  # בזמן שהקבצים עצמם ישבו שלמים ב-${BACKUP_DIR}. עדכון ידני מתוך
  # תיקיית הריפו עבד תקין — ומכאן שהתסמין נראה אקראי.
  # ------------------------------------------------------------------
  updater:
    image: ${IMAGE_PREFIX:-ghcr.io/multidigitalltd/metavchim}-updater:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      UPDATE_SECRET: ${UPDATE_SECRET:-}
      REPO_DIR: ${REPO_DIR:-/srv/metavchim}
    volumes:
      # שליטה ב-Docker של המארח — כך הסוכן מרים גרסאות חדשות
      - /var/run/docker.sock:/var/run/docker.sock
      # אותו נתיב מוחלט בדיוק כמו על המארח — ראו ההסבר למעלה
      - ./:${REPO_DIR:-/srv/metavchim}:ro
      # אישורי ה-Registry של המארח (docker login ghcr.io) לצורך pull.
      # לא ~/.docker — compose אינו מרחיב טילדה, והנתיב היה נפתר
      # כתיקייה יחסית בשם "~" במקום כספריית הבית.
      - ${DOCKER_CONFIG_DIR:-/root/.docker}:/root/.docker:ro

volumes:
  sttmodels:
  diarizemodels:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
  offsitestate:
