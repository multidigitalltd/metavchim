# ============================================================
# פרודקשן על שרת יחיד (VPS) — ראו docs/10-deployment.md להוראות מלאות.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# התמונות נבנות ב-CI על כל מיזוג ל-main ונדחפות ל-GHCR; כפתור העדכון
# במסך ההגדרות מפעיל את שירות ה-updater שמושך ומרים אותן מחדש.
# ============================================================
name: metavchim

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metavchim
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?חסר DB_OWNER_PASSWORD ב-.env.production}
      POSTGRES_DB: metavchim
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?חסר APP_DB_PASSWORD ב-.env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # תפקיד האפליקציה (RLS) נוצר אוטומטית בעליית ה-DB הראשונה —
      # לפני מיגרציות ה-API, שמפנות אליו
      - ./infra/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metavchim"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF — משימות BullMQ שורדות ריסטרט
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - miniodata:/data

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/multidigitalltd/metavchim}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    # loopback בלבד — נגיש ל-Proxy מקומי (nginx קיים) ולדיבוג, לא לאינטרנט
    ports:
      - "127.0.0.1:${API_LOCAL_PORT:-8091}:3001"
    environment:
      UPDATER_URL: http://updater:9944
    volumes:
      # רשימת הגיבויים ומחיקה מהמסך /platform. הרשאת כתיבה מכוונת:
      # השחזור עצמו עובר דרך סוכן העדכון, אבל מחיקה נעשית כאן.
      - ${BACKUP_DIR:-./backups}:/backups
      # מצב הסנכרון החיצוני — לקריאה בלבד. אישורי ה-R2 נשארים
      # בקונטיינר offsite ולא נחשפים לאפליקציה.
      - offsitestate:/state:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  workers:
    image: ${IMAGE_PREFIX:-ghcr.io/multidigitalltd/metavchim}-workers:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      # ה-API מריץ מיגרציות בעלייה — ה-Workers מחכה שיהיה בריא
      api:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/multidigitalltd/metavchim}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_LOCAL_PORT:-8090}:3000"

  # שער ה-HTTPS המובנה — פעיל רק בפרופיל standalone (שרת ייעודי).
  # על שרת עם אתר קיים (nginx תופס 80/443) משאירים את הפרופיל כבוי
  # ומחברים דרך ה-nginx הקיים — ראו docs/10-deployment.md.
  caddy:
    profiles: ["standalone"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # לא :? — compose מפרש את הקובץ *לפני* סינון הפרופילים, ולכן
      # DOMAIN חסר היה מפיל **כל** פקודת compose בשרת שמריץ מאחורי
      # nginx קיים (שם הפרופיל standalone כבוי ו-Caddy לא רץ בכלל).
      # התסמין קשה לאבחון: גם `logs`, גם `ps` וגם `up -d` נופלים על
      # שירות שאינו בשימוש — וגיבוי חיצוני שלא הורם נראה כמו תקלת
      # גיבוי. Caddy עצמו נכשל בבירור אם הפרופיל דלוק והערך ריק.
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

  # תמלול מקומי (faster-whisper על CPU) — ההקלטות לא יוצאות מהשרת.
  # פעיל רק בפרופיל stt: מוסיפים stt ל-COMPOSE_PROFILES.
  # דורש ~2GB RAM פנויים; ראו docs/10-deployment.md §תמלול מקומי.
  stt:
    profiles: ["stt"]
    build:
      context: ./infra/stt
    restart: unless-stopped
    environment:
      STT_MODEL: ${STT_MODEL:-ivrit-ai/whisper-large-v3-turbo-ct2}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_LANGUAGE: ${STT_LANGUAGE:-he}
      # לא :? — compose מפרש את הקובץ *לפני* סינון הפרופילים, וסוד
      # חסר היה שובר כל פקודה גם כשהתמלול כבוי. השירות עצמו נכשל
      # בבירור בעלייה אם הסוד ריק (ראו server.py).
      STT_SECRET: ${STT_SECRET:-}
      STT_CONCURRENCY: ${STT_CONCURRENCY:-1}
      OMP_NUM_THREADS: ${STT_THREADS:-2}
    volumes:
      # מטמון המודל — נמשך פעם אחת ונשאר בין הפעלות
      - sttmodels:/models
    # תקרת משאבים: התמלול לא יחנוק את שאר המערכת
    deploy:
      resources:
        limits:
          memory: ${STT_MEMORY_LIMIT:-3g}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # גיבוי אוטומטי — pg_dump יומי + ארכיון תמונות שבועי אל ${BACKUP_DIR}
  # במארח. שחזור: ראו docs/10-deployment.md §גיבוי ושחזור.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup/run.sh"]
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD:?חסר DB_OWNER_PASSWORD ב-.env.production}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_MEDIA_KEEP_DAYS: ${BACKUP_MEDIA_KEEP_DAYS:-28}
    volumes:
      - ./infra/backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - miniodata:/minio-data:ro
    depends_on:
      postgres:
        condition: service_healthy

  # עותק גיבוי מחוץ לשרת — סנכרון תיקיית הגיבויים לאחסון ענן תואם-S3
  # (Backblaze B2 / Cloudflare R2 / AWS S3…). פעיל רק בפרופיל offsite:
  # מוסיפים offsite ל-COMPOSE_PROFILES וממלאים את משתני OFFSITE_S3_*.
  offsite:
    profiles: ["offsite"]
    image: rclone/rclone:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup/offsite.sh"]
    environment:
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      # R2 דורש region=auto; לספקים אחרים אפשר לדרוס במשתנה
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_S3_REGION:-auto}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_KEY:-}
      # טוקן R2 מוגבל לדלי אחד אינו רשאי ליצור דליים; בלי זה rclone
      # מנסה לוודא קיום דלי ונכשל בהרשאה
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: ${OFFSITE_S3_NO_CHECK_BUCKET:-true}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
    volumes:
      - ./infra/backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups:ro
      # קובץ מצב הסנכרון שה-API קורא (/platform ⟵ גיבויים)
      - offsitestate:/state
    depends_on:
      - backup

  # שחזור מגיבוי — אף פעם לא עולה מעצמו (פרופיל ייעודי). סוכן העדכון
  # מריץ אותו כפעולה חד-פעמית אחרי שעצר את שירותי האפליקציה.
  restore:
    profiles: ["restore"]
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/backup/restore.sh"]
    environment:
      # לא :? מאותה סיבה כמו ב-caddy — שירות מאחורי פרופיל שדורש
      # משתנה מפיל כל פקודת compose. אין כאן ויתור על הבדיקה:
      # postgres ו-backup, שרצים תמיד, כבר דורשים את המשתנה הזה.
      PGPASSWORD: ${DB_OWNER_PASSWORD:-}
    volumes:
      - ./infra/backup:/backup:ro
      # כתיבה — גם דאמפ הבטיחות לפני השחזור נשמר כאן
      - ${BACKUP_DIR:-./backups}:/backups
      # שחזור התמונות דורס את תוכן ה-volume, ולכן אינו read-only
      - miniodata:/minio-data
    depends_on:
      postgres:
        condition: service_healthy

  updater:
    image: ${IMAGE_PREFIX:-ghcr.io/multidigitalltd/metavchim}-updater:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      UPDATE_SECRET: ${UPDATE_SECRET:?חסר UPDATE_SECRET ב-.env.production}
      REPO_DIR: /srv/repo
    volumes:
      # שליטה ב-Docker של המארח — כך הסוכן מרים גרסאות חדשות
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/srv/repo:ro
      # אישורי ה-Registry של המארח (docker login ghcr.io) לצורך pull
      - ${DOCKER_CONFIG_DIR:-~/.docker}:/root/.docker:ro

volumes:
  sttmodels:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
  offsitestate:
