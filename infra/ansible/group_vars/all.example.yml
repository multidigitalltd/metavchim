# משתני ההתקנה — הערכים שאינם סוד.
#
# הסודות **אינם כאן**. הם יושבים ב-vault.yml מוצפן ב-ansible-vault,
# שגם הוא אינו נכנס לגיט. הפרדה ולא קובץ אחד: את הקובץ הזה נוח
# לקרוא ולסקור בפול-ריקווסט, ואת השני אסור לפתוח בכלל.
---
domain: app.metavchim.co.il
app_dir: /srv/metavchim
repo_url: https://github.com/multidigitalltd/metavchim.git
# מה נפרס. `main` נכון לפריסה שוטפת; תג או SHA כשרוצים לקבע גרסה
repo_version: main
image_prefix: ghcr.io/multidigitalltd/metavchim
image_tag: latest
# יכולות רשות: stt (תמלול מקומי), diarize (זיהוי דוברים),
# offsite (גיבוי חיצוני). ריק = ליבה בלבד.
compose_profiles: ""
# מי רשאי להיכנס למסך /platform — כתובות מופרדות בפסיק, של משתמשים
# שכבר קיימים במערכת. ריק = המסך כבוי, כלומר שרת שאי אפשר לנהל.
platform_admin_emails: ""
